<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KHO — 3D Scroll Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0b;
        --fg: #e4e4e7;
        --muted: #71717a;
        --accent: #d4a22f;
        --card-bg: rgba(24, 24, 27, 0.55);
        --card-border: rgba(255, 255, 255, 0.08);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: "Geist", system-ui, sans-serif;
        touch-action: none;
        overscroll-behavior: none;
      }
      canvas#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

      .mono {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.3em;
      }
      .hud { position: fixed; z-index: 10; pointer-events: none; }
      .hud-tl { top: 24px; left: 24px; display: flex; align-items: center; gap: 10px; color: var(--fg); }
      .hud-tr { top: 24px; right: 24px; color: var(--accent); text-align: right; }
      .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px rgba(212, 162, 47, 0.85);
      }

      .intro {
        position: fixed; left: 24px; bottom: 96px; z-index: 10; pointer-events: none;
        display: flex; flex-direction: column; gap: 16px;
      }
      .intro h1 {
        font-size: clamp(2.6rem, 7vw, 6rem); font-weight: 600;
        line-height: 0.95; letter-spacing: -0.04em;
      }
      .intro h1 span { color: var(--accent); }
      .intro p { color: #a1a1aa; max-width: 40ch; font-size: 14px; line-height: 1.6; }

      .bottom { position: fixed; inset: auto 0 0 0; z-index: 10; pointer-events: none; padding: 0 24px 16px; }
      .bar { height: 1px; background: rgba(255, 255, 255, 0.1); margin-bottom: 12px; overflow: hidden; }
      .bar > div { height: 100%; width: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
      .bottom-row { display: flex; justify-content: space-between; color: var(--muted); }

      .card {
        position: fixed; top: 30%; z-index: 20; width: min(360px, 34vw);
        padding: 24px; border-radius: 20px;
        background: var(--card-bg); border: 1px solid var(--card-border);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        box-shadow: 0 1px 0 0 rgba(255, 255, 255, 0.04) inset, 0 20px 40px -20px rgba(0, 0, 0, 0.6);
        opacity: 0; pointer-events: none;
        transform: translateY(-50%);
      }
      .card.left { left: 5vw; }
      .card.right { right: 5vw; }
      .card .label { color: var(--accent); }
      .card h2 { margin-top: 12px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
      .card p { margin-top: 8px; color: #a1a1aa; font-size: 14px; line-height: 1.6; }
      .card .tags { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; color: #d4d4d8; }
      .card .tags span { border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 999px; padding: 5px 10px; }

      @media (max-width: 768px) {
        .card { top: auto; bottom: 88px; transform: none; width: auto; left: 16px !important; right: 16px !important; padding: 18px; }
        .card h2 { font-size: 20px; }
        .intro { left: 16px; bottom: 88px; }
        .hud-tl { left: 16px; } .hud-tr { right: 16px; }
        .bottom { padding: 0 16px 14px; }
        .bottom-row span:nth-child(2) { display: none; }
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="hud hud-tl mono"><span class="dot"></span>KHO // Prototype</div>
    <div class="hud hud-tr mono" id="readout">INTRO · 000%</div>

    <div class="intro" id="intro">
      <span class="mono" style="color: var(--accent)">Protocol — 3D scroll test</span>
      <h1>Build<br />with <span>KHO</span></h1>
      <p>Scroll qiling: odam yaqinlashadi, noutbukni ochadi, keyin chapga va o'ngga cheksiz buriladi.</p>
    </div>

    <div class="card left" id="card">
      <span class="mono label" id="card-label">Loyiha 01</span>
      <h2 id="card-title">—</h2>
      <p id="card-desc">—</p>
      <div class="tags mono" id="card-tags"></div>
    </div>

    <div class="bottom">
      <div class="bar"><div id="bar"></div></div>
      <div class="bottom-row mono">
        <span id="seg">SEG 000</span>
        <span>Three.js // Procedural</span>
        <span>Scroll &darr;</span>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
